name: Cloudflare へデプロイ

# master の HP を Cloudflare の Worker「startus-site」（startus-kanazawa.org）に出す（2026-11-03〜）。
# OpenNext（@opennextjs/cloudflare）で組み立てて出す。手元の Windows で組み立てるのは OpenNext が勧めていないので、ふだんはこちら
# NEXT_PUBLIC_ の値は GitHub の変数（Settings → Secrets and variables → Actions → Variables）。画面に配る公開の値だけ
on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: deploy-cloudflare
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: c0b07b6ab88df72ca8378aca4fe0fc63
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: 公開用の値を用意する
        env:
          NEXT_PUBLIC_GOOGLE_MAPS_API_KEY: ${{ vars.NEXT_PUBLIC_GOOGLE_MAPS_API_KEY }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          NEXT_PUBLIC_GA_MEASUREMENT_ID: ${{ vars.NEXT_PUBLIC_GA_MEASUREMENT_ID }}
        run: |
          for k in NEXT_PUBLIC_GOOGLE_MAPS_API_KEY NEXT_PUBLIC_SUPABASE_URL NEXT_PUBLIC_SUPABASE_ANON_KEY NEXT_PUBLIC_GA_MEASUREMENT_ID; do
            if [ -z "${!k:-}" ]; then echo "::error::変数 $k がありません"; exit 1; fi
            printf '%s=%s\n' "$k" "${!k}" >> .env.production.local
          done
      - name: 組み立てて出す
        run: |
          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ]; then echo "::error::CLOUDFLARE_API_TOKEN がありません"; exit 1; fi
          npm run deploy
